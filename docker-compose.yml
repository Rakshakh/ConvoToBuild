version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: convotobuild-db
    environment:
      POSTGRES_USER: convotobuild
      POSTGRES_PASSWORD: convotobuild_password
      POSTGRES_DB: convotobuild
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convotobuild"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: convotobuild-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convotobuild-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://convotobuild:convotobuild_password@postgres:5432/convotobuild?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
